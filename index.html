<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>User Management Dashboard</h1>

    <!-- Add/Edit User Form -->
    <form id="userForm">
      <input type="text" id="nameInput" placeholder="Name" required>
      <input type="email" id="emailInput" placeholder="Email" required>
      <input type="text" id="courseInput" placeholder="Course" required>
      <button type="submit" id="formSubmitBtn">Add</button>
    </form>
    <p id="formError" class="error-text"></p>

    <!-- Search -->
    <input type="text" id="searchInput" placeholder="Search User...">

    <!-- Course Filter -->
    <select id="courseFilter">
      <option value="All">All</option>
      <option value="MERN">MERN</option>
      <option value="React">React</option>
      <option value="Node.js">Node.js</option>
      <option value="C++">C++</option>
    </select>

    <!-- Counter -->
    <p>Total Users: <span id="userCount">0</span></p>

    <!-- Loading / Error message -->
    <p id="statusMessage"></p>

    <!-- Users Table -->
    <table id="userTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Course</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <!-- Users will be added here dynamically by JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
